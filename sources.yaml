x_queries:
  - name: Tamil Nadu News General
    type: x
    crawl_method: x_api
    x_query: '("Tamil Nadu" OR TamilNadu OR தமிழ்நாடு OR சென்னை OR திமுக OR அதிமுக OR பாஜக OR விஜய் OR சீமான் OR ஆளுநர் OR மழை OR வேலை OR கல்வி OR சாலை OR மருத்துவம் OR குற்றம்) lang:ta -is:retweet'
    url: "https://x.com/search"

  - name: Tamil Nadu Public Issues
    type: x
    crawl_method: x_api
    x_query: '(தமிழ்நாடு OR சென்னை OR மதுரை OR கோயம்புத்தூர்) (மழை OR வேலை OR கல்வி OR NEET OR சாலை OR மின்சாரம் OR மருத்துவம் OR விலை) lang:ta -is:retweet'
    url: "https://x.com/search"
